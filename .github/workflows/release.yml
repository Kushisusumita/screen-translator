name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Belt and braces: the trigger above already limits this to main, and this
    # keeps it that way if a tag, a schedule or workflow_dispatch is ever added.
    # A release cut from a feature branch would tag and publish unreviewed work.
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        shell: bash
        run: |
          # Latest semver tag, or v0.0.0 if none exist
          LATEST=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -1 || true)
          [ -z "$LATEST" ] && LATEST="v0.0.0"
          echo "Latest tag: $LATEST"

          # Split into components
          VER=${LATEST#v}
          MAJOR=${VER%%.*}; REST=${VER#*.}
          MINOR=${REST%%.*}; PATCH=${REST#*.}

          # Read the latest commit message
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"

          # Determine bump
          if echo "$MSG" | grep -qE '^(feat|fix|refactor|perf|build|ci)!:|BREAKING[ -]CHANGE'; then
            MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0
          elif echo "$MSG" | grep -qE '^feat(\([^)]*\))?:'; then
            MINOR=$((MINOR+1)); PATCH=0
          else
            PATCH=$((PATCH+1))
          fi

          NEW="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW"
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Screen Translator ${{ steps.ver.outputs.tag }}"
          generate_release_notes: true
          files: target/release/screen-translator.exe
