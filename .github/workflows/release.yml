name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    # Belt and braces: the trigger above already limits this to main, and this
    # keeps it that way if a tag, a schedule or workflow_dispatch is ever added.
    # A release cut from a feature branch would tag and publish unreviewed work.
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: ver
        shell: bash
        run: |
          # Cargo.toml is the single source of truth. Deriving the tag from the
          # previous tag instead — which this used to do — let the released
          # version drift away from the one the program reports about itself:
          # v0.0.2 on the release page, 0.2.0 in the About page.
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "No version in Cargo.toml" >&2
            exit 1
          fi
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a version that already exists
        shell: bash
        run: |
          # Bumping Cargo.toml is now the act of cutting a release, so a push
          # that forgot to is a mistake worth failing on rather than silently
          # overwriting yesterday's binaries.
          if git rev-parse "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.ver.outputs.tag }} already exists — bump the version in Cargo.toml." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Sakura Screen Translator ${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: target/release/screen-translator.exe
