name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Read once, on one runner, so all three builds and the release itself agree
  # on what is being published.
  version:
    runs-on: ubuntu-latest
    # Belt and braces: the trigger above already limits this to main, and this
    # keeps it that way if a tag, a schedule or workflow_dispatch is ever added.
    # A release cut from a feature branch would tag and publish unreviewed work.
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: ver
        shell: bash
        run: |
          # Cargo.toml is the single source of truth. Deriving the tag from the
          # previous tag instead — which this used to do — let the released
          # version drift away from the one the program reports about itself:
          # v0.0.2 on the release page, 0.2.0 in the About page.
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "No version in Cargo.toml" >&2
            exit 1
          fi
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a version that already exists
        shell: bash
        run: |
          # Bumping Cargo.toml is now the act of cutting a release, so a push
          # that forgot to is a mistake worth failing on rather than silently
          # overwriting yesterday's binaries.
          if git rev-parse "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.ver.outputs.tag }} already exists — bump the version in Cargo.toml." >&2
            exit 1
          fi

  # One binary per platform, named so the updater can pick its own out of the
  # release without guessing.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: screen-translator-windows-x86_64.exe
          - os: macos-latest
            asset: screen-translator-macos-universal
          - os: ubuntu-latest
            asset: screen-translator-linux-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-release-

      # Same list the CI job installs: xcap links against PipeWire for the
      # Wayland portal and its -sys crate runs bindgen.
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libgtk-3-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev libdbus-1-dev \
            libgbm-dev libxdo-dev

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release

      # One file that runs on both Apple silicon and Intel, so the updater has a
      # single asset to fetch whatever the machine is.
      - name: Build (universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create -output target/release/screen-translator \
            target/x86_64-apple-darwin/release/screen-translator \
            target/aarch64-apple-darwin/release/screen-translator
          lipo -info target/release/screen-translator

      - name: Name the binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/screen-translator.exe "${{ matrix.asset }}"
          else
            cp target/release/screen-translator "${{ matrix.asset }}"
            chmod +x "${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List what is being published
        run: ls -la assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Sakura Screen Translator ${{ needs.version.outputs.version }}"
          generate_release_notes: true
          files: assets/*
