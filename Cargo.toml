[package]
name = "screen-translator"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "screen-translator"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
egui = "0.29"
eframe = { version = "0.29", features = ["default"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "cookies", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }
toml = "0.8"
dirs = "5"
arboard = "3"
rand = "0.8"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
once_cell = "1"
chromiumoxide = { version = "0.6", features = ["tokio-runtime"] }
futures = "0.3"
base64 = "0.22"

# Everything below this line is per-platform on purpose: a Windows build must
# not pull in a single macOS or Linux crate, and vice versa. Windows keeps its
# hand-written Win32 implementations; the other platforms share portable crates.
[target.'cfg(not(windows))'.dependencies]
# Screen and window capture on macOS (ScreenCaptureKit / CoreGraphics) and Linux
# (X11, Wayland via the portal).
xcap = "0.9"
# Global shortcuts: Carbon hotkeys on macOS, XGrabKey on Linux.
global-hotkey = "0.8"
# Tray icon: NSStatusItem on macOS, StatusNotifierItem / appindicator on Linux.
tray-icon = "0.24"
# Tokens at rest: the login Keychain on macOS and the Secret Service (GNOME
# Keyring, KWallet) on Linux, the way DPAPI seals them on Windows. The default
# feature set already picks the right backend per target.
keyring = "4"
# Neither store seals an arbitrary blob the way DPAPI does, so one key from the
# store encrypts the config's tokens.
chacha20poly1305 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
# The capture overlay has to sit above the menu bar and the Dock, which is a
# window level and a frame no winit or eframe API exposes.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSScreen",
    "NSResponder",
    # Carries NSApplicationActivationPolicy, which turns the process into a
    # menu-bar agent so the overlay does not drag the user to another Space.
    "NSRunningApplication",
    # Rounding the corners of the frameless windows: the view's layer does the
    # clipping, and the window behind it has to be clear for that to show.
    "NSView",
    "NSColor",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
# CALayer, for clipping a frameless window to rounded corners.
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_System_Threading",
] }
winreg = "0.52"
# Action Center toasts for the "update available" notification.
tauri-winrt-notification = "0.8"

[build-dependencies]
# The build script rasterises the app icon from the same geometry the UI draws.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

# Only the Windows build embeds an icon resource in the executable.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
