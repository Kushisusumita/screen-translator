[package]
name = "screen-translator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "screen-translator"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
egui = "0.29"
eframe = { version = "0.29", features = ["default"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_Threading",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "ico"] }
toml = "0.8"
dirs = "5"
arboard = "3"
rand = "0.8"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
chromiumoxide = { version = "0.6", features = ["tokio-runtime"] }
futures = "0.3"
winreg = "0.52"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
